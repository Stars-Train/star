<!DOCTYPE html>
<html lang="pt-BR"><head>
<script src="sala.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Itens — RPG</title>
<script>if(!sessionStorage.getItem("logado")){location.replace("login.html");}</script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--bg2:#111;--bg3:#161616;--b:#2a2a2a;--b2:#444;--gold:#ccc;--dim:#888;--t2:#777;--ac:#c9a84c;--r:6px}
body{font-family:'Crimson Text',Georgia,serif;background:var(--bg);color:#fff;font-size:16px;line-height:1.5}
input,textarea,select{font-family:inherit;font-size:15px;color:#fff;background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:6px 10px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--b2)}
button{font-family:inherit;cursor:pointer;border-radius:var(--r);border:1px solid var(--b2);background:transparent;color:var(--gold);padding:6px 12px;font-size:14px;transition:.18s}
button:hover{background:var(--bg3);border-color:var(--ac);color:var(--ac)}
.pri{font-family:'Cinzel',serif;font-size:12px;border-color:var(--ac);color:var(--ac)}
.wrap{max-width:820px;margin:0 auto;padding:1.5rem}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:1rem;border-bottom:1px solid var(--b);margin-bottom:1rem}
.title{font-family:'Cinzel',serif;font-size:20px;letter-spacing:1px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem}.tools input{flex:1;min-width:160px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.2rem}
.chip{border-radius:16px;padding:3px 12px;font-size:13px}.chip.on{background:#201808;border-color:var(--ac);color:var(--ac)}
.cat{font-family:'Cinzel',serif;color:var(--ac);letter-spacing:1.5px;font-size:13px;margin:1.6rem 0 .7rem;display:flex;align-items:center;gap:10px}
.cat::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#604808,transparent)}
.card{background:var(--bg2);border:1px solid var(--b);border-left:3px solid #604808;border-radius:var(--r);padding:14px 16px;margin-bottom:12px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card:hover{border-color:var(--b2);border-left-color:var(--ac)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.nm{font-family:'Cinzel',serif;color:var(--ac);font-size:16px}
.ac{display:flex;gap:4px}.ac button{padding:3px 8px;font-size:14px;border-color:transparent}
.fav.on{color:#f2c500}
.step{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0;border-top:1px dashed var(--b)}
.step:first-of-type{border-top:0}
.ing{background:var(--bg3);border:1px solid var(--b2);border-radius:14px;padding:2px 11px;font-size:14px}
.op{color:var(--dim);font-weight:600}
.res{border:1px solid var(--ac);background:#201808;color:var(--ac);border-radius:14px;padding:2px 11px;font-size:14px;font-weight:600}
.cost{margin-top:8px;font-size:14px;color:#f08070}.note{margin-top:6px;font-size:14px;color:var(--dim);font-style:italic}
.empty{text-align:center;color:var(--t2);padding:2rem}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:99;align-items:center;justify-content:center;padding:16px}.ov.open{display:flex}
.box{background:var(--bg2);border:1px solid #604808;border-radius:8px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:18px}
.box h3{font-family:'Cinzel',serif;color:var(--ac);margin-bottom:12px;font-size:15px}.box label{display:block;font-size:12px;color:var(--dim);margin:10px 0 3px}
.etp{border:1px solid var(--b);border-radius:var(--r);padding:8px;margin-top:8px}.etp textarea{min-height:60px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--ac);color:var(--ac);padding:9px 16px;border-radius:var(--r);opacity:0;transition:.3s;pointer-events:none}
</style></head><body>
<div class="wrap">
 <div class="head"><div class="title">⚗️ Itens &amp; Crafting</div>
  <div style="display:flex;gap:8px"><button id="addBtn" class="pri" style="display:none" onclick="abrir()">+ Adicionar Crafting</button><button id="seedBtn" style="display:none;font-size:12px" onclick="seed()">Importar do PDF</button><button onclick="location.href='index.html'">← Voltar</button></div></div>
 <div class="tools"><input id="q" placeholder="🔍 Buscar crafting ou ingrediente..." oninput="draw()"><button id="favF" onclick="favOnly=!favOnly;this.classList.toggle('on',favOnly);draw()">⭐ Favoritos</button></div>
 <div class="chips" id="chips"></div><div id="list"></div>
</div>
<div class="ov" id="ov"><div class="box"><h3 id="mt">Novo Crafting</h3>
 <label>Nome do resultado final</label><input id="fNome"><label>Categoria / Sistema</label><input id="fCat" placeholder="Ex: Sistema Sol" list="cats">
 <datalist id="cats"></datalist>
 <div id="etps"></div><button style="margin-top:8px;font-size:12px" onclick="addEtp()">+ Etapa</button>
 <label>Custo real (opcional)</label><input id="fCusto"><label>Observação (opcional)</label><input id="fNota">
 <div class="row"><button onclick="fechar()">Cancelar</button><button class="pri" onclick="salvar()">Salvar</button></div></div></div>
<div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getDatabase,ref as _ref,set,remove,onValue} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const ref = (d, p) => _ref(d, P(p)); // caminhos dentro da sala atual
const firebaseConfig = {
  apiKey: "AIzaSyCEiRmGP4wGrfDwbbIadvrt1Ik56ecbKYk",
  authDomain: "path-of-stars.firebaseapp.com",
  databaseURL: "https://path-of-stars-default-rtdb.firebaseio.com",
  projectId: "path-of-stars",
  storageBucket: "path-of-stars.firebasestorage.app",
  messagingSenderId: "565088659888",
  appId: "1:565088659888:web:8ee544001aee376e9f0e75"
};
const db=getDatabase(initializeApp(firebaseConfig)),isMestre=sessionStorage.getItem("tipo")==="mestre";
let data={},cat="Todos",favOnly=false,edit=null;
const LS=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let favs=LS('craftFavs'+SALA_SUF);
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity=0,2200)};
if(isMestre){$('addBtn').style.display='';}
onValue(ref(db,'crafting'),s=>{data=s.exists()?s.val():{};$('seedBtn').style.display=isMestre&&!Object.keys(data).length?'':'none';draw()});
const parse=l=>{const m=l.trim().match(/^(\d+)\s+(.+)$/);return m?{q:+m[1],n:m[2]}:{q:1,n:l.trim()}};
function draw(){
 const all=Object.values(data),cats=['Todos',...new Set(all.map(r=>r.cat||'Geral'))];
 if(!cats.includes(cat))cat='Todos';
 $('chips').innerHTML=cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
 $('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;draw()});
 $('cats').innerHTML=cats.slice(1).map(c=>`<option value="${esc(c)}">`).join('');
 const q=$('q').value.toLowerCase().trim();
 const rs=all.filter(r=>(cat==='Todos'||(r.cat||'Geral')===cat)&&(!favOnly||favs[r.id])&&(!q||JSON.stringify(r).toLowerCase().includes(q)));
 if(!rs.length){$('list').innerHTML='<div class="empty">⚗️ Nenhum crafting encontrado.</div>';return}
 const g={};rs.forEach(r=>(g[r.cat||'Geral']??=[]).push(r));
 $('list').innerHTML=Object.entries(g).map(([c,a])=>`<div class="cat">${esc(c)}</div>`+a.map(card).join('')).join('');
}
function card(r){
 const steps=(r.etapas||[]).map(e=>`<div class="step">${(e.ings||[]).map(g=>`<span class="ing">${g.q} ${esc(g.n)}</span>`).join('<span class="op">+</span>')}<span class="op">=</span><span class="res">1 ${esc(e.res)}</span></div>`).join('');
 return `<div class="card"><div class="ch"><span class="nm">${esc(r.nome)}</span><div class="ac"><button class="fav ${favs[r.id]?'on':''}" onclick="fv('${r.id}')" title="Favoritar">${favs[r.id]?'★':'☆'}</button><button onclick="cp('${r.id}')" title="Copiar">📋</button>${isMestre?`<button onclick="abrir('${r.id}')">✏️</button><button onclick="del('${r.id}')">🗑</button>`:''}</div></div>
 ${steps}${r.custo?`<div class="cost">💰 Custo real: ${esc(r.custo)}</div>`:''}${r.nota?`<div class="note">${esc(r.nota)}</div>`:''}</div>`;
}
window.fv=id=>{favs[id]=!favs[id];SV('craftFavs'+SALA_SUF,favs);draw()};
window.cp=id=>{const r=data[id];const t=r.nome+'\n'+r.etapas.map(e=>e.ings.map(g=>g.q+' '+g.n).join(' + ')+' = 1 '+e.res).join('\n')+(r.custo?'\nCusto real: '+r.custo:'');navigator.clipboard?.writeText(t).then(()=>toast('Receita copiada!'))};
window.del=id=>{if(confirm('Excluir este crafting?'))remove(ref(db,'crafting/'+id))};
window.addEtp=(ings='',res='')=>{const d=document.createElement('div');d.className='etp';d.innerHTML=`<label>Ingredientes (um por linha, ex: 2 Pedra da Lua)</label><textarea class="eI"></textarea><label>Resultado da etapa</label><input class="eR"><button style="font-size:11px;margin-top:6px" onclick="this.parentElement.remove()">remover etapa</button>`;d.querySelector('.eI').value=ings;d.querySelector('.eR').value=res;$('etps').appendChild(d)};
window.abrir=id=>{if(!isMestre)return;edit=id||null;const r=id?data[id]:{};$('mt').textContent=id?'Editar Crafting':'Novo Crafting';$('fNome').value=r.nome||'';$('fCat').value=r.cat||'';$('fCusto').value=r.custo||'';$('fNota').value=r.nota||'';$('etps').innerHTML='';
 (r.etapas||[{ings:[],res:''}]).forEach(e=>addEtp(e.ings.map(g=>g.q+' '+g.n).join('\n'),e.res));$('ov').classList.add('open')};
window.fechar=()=>$('ov').classList.remove('open');
window.salvar=()=>{const nome=$('fNome').value.trim();if(!nome)return toast('Dê um nome');
 const etapas=[...document.querySelectorAll('.etp')].map(d=>({ings:d.querySelector('.eI').value.split('\n').filter(l=>l.trim()).map(parse),res:d.querySelector('.eR').value.trim()||nome})).filter(e=>e.ings.length);
 if(!etapas.length)return toast('Adicione ingredientes');
 const id=edit||'_'+Math.random().toString(36).slice(2,9);
 set(ref(db,'crafting/'+id),{id,nome,cat:$('fCat').value.trim()||'Geral',etapas,custo:$('fCusto').value.trim(),nota:$('fNota').value.trim()}).then(()=>{toast('Salvo!');fechar()})};
window.seed=()=>{const S=[
 ['Essência Evoluída de Caminho','Essências dos Caminhos',[[['1 Essência de Caminho','1 Essência de Caminho'],'Essência Evoluída de Caminho']],'','Existe essência de qualquer Caminho.'],
 ['Essência Pura de Caminho','Essências dos Caminhos',[[['1 Essência Evoluída de Caminho','1 Essência Evoluída de Caminho'],'Essência Pura de Caminho']],'4 Essências de Caminho = 1 Essência Pura',''],
 ['Fragmento do Sol','Sistema Sol',[[['1 Raio do Sol','1 Raio do Sol'],'Fragmento do Sol']],'',''],
 ['Essência Pura do Sol','Sistema Sol',[[['1 Fragmento do Sol','1 Fragmento do Sol'],'Essência Pura do Sol']],'4 Raios do Sol = 1 Essência Pura do Sol',''],
 ['Essência Impura (ex.: Entropia da Lua)','Essências Impuras',[[['1 Essência Evoluída da Entropia','1 Pedra da Lua'],'Essência de Entropia da Lua'],[['1 Essência de Entropia da Lua','1 Essência de Entropia da Lua'],'Essência Impura de Entropia da Lua']],'','Funde um item normal com 1 Essência Evoluída e depois soma o resultado com ele mesmo. Itens normais: Essência de Caminho, Raio de Sol, Escama de Dragão, Pedra da Lua.']];
 S.forEach(([nome,cat,e,custo,nota])=>{const id='_'+Math.random().toString(36).slice(2,9);set(ref(db,'crafting/'+id),{id,nome,cat,custo,nota,etapas:e.map(([i,res])=>({ings:i.map(parse),res}))})});toast('Importado!')};
</script></body></html>
